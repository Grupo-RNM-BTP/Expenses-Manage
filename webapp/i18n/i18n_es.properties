popUpBlocked=Tu navegador está bloqueando las ventanas emergentes.\n\n🚫 El documento no se puede abrir porque las ventanas emergentes están bloqueadas.\n\n Sigue los pasos a continuación para permitir ventanas emergentes:\n\n=== 📱 Google Chrome/Edge (Android/iPhone) ===\n1️⃣ Abre Chrome y toca el menú (⋮).\n2️⃣ Selecciona “Configuración“.\n3️⃣ Entra en “Configuración de sitios” o “Configuración de contenido”.\n4️⃣ Toca “Ventanas emergentes y redirecciones”.\n5️⃣ Desactiva la opción que bloquea las ventanas emergentes.\n\n=== 📱 Safari (iPhone/iPad) ===\n1️⃣ Abre la “Configuración” del dispositivo.\n2️⃣ Desplázate hacia abajo y toca “Safari”.\n3️⃣ Busca la opción “Bloquear ventanas emergentes“.\n4️⃣ Desactiva esa opción.\n\n Después de permitir las ventanas emergentes, vuelve a la aplicación e inténtalo de nuevo.
