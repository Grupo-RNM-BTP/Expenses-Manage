    <title>Expenses Manage</title>
    <style>
        html,
        body,
        body>div,
        #container,
        #container-uiarea {
            height: 100%;
        }

    <script>
        window.Module = {
            onRuntimeInitialized() {
                window.cvReady = true;
            }
        };
    </script>
    <script async src="https://docs.opencv.org/4.8.0/opencv.js"></script>
    <script>
        function getSapUiCoreSrc() {
            var hostname = window.location.hostname;

            if (hostname.includes("sap.grupornm.pt")) {
                return "https://sap.grupornm.pt:44300/sap/bc/ui5_ui5/sap/zca_auth/resources/sap-ui-core.js";
            } else if (hostname.includes("sapdev.grupornm.pt")) {
                return "https://sapdev.grupornm.pt:44300/sap/bc/ui5_ui5/sap/zca_auth/resources/sap-ui-core.js";
            } else {
                return "/resources/sap-ui-core.js"; 
            }
        }

        var script = document.createElement('script');
        script.id = "sap-ui-bootstrap";
        script.src = getSapUiCoreSrc();

        script.setAttribute('data-sap-ui-theme', 'sap_horizon');
        script.setAttribute('data-sap-ui-resourceroots', '{"zfiexpensesmanage": "./"}'); 
        script.setAttribute('data-sap-ui-oninit', 'module:sap/ui/core/ComponentSupport');
        script.setAttribute('data-sap-ui-compatVersion', 'edge');
        script.setAttribute('data-sap-ui-async', 'true');
        script.setAttribute('data-sap-ui-frameOptions', 'trusted');

        if (!window.location.hostname.includes("sapdev") &&
            !window.location.hostname.includes("sap.grupornm.pt")) {
            script.removeAttribute('data-sap-ui-appCacheBuster');
        }

        document.head.appendChild(script);
    </script>
